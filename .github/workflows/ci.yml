name: CI

on:
  push:
    branches: [main, master, develop, "feat/**"]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: alar
          POSTGRES_PASSWORD: alar
          POSTGRES_DB: alar_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alar -d alar_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://alar:alar@localhost:5432/alar_ci
      DIRECT_URL: postgresql://alar:alar@localhost:5432/alar_ci
      JWT_SECRET: ci-test-secret-min-32-characters-long
      AUTH_ADMIN_EMAIL: admin@alar.com.br
      AUTH_ADMIN_PASSWORD: AlarAdminChangeMe1
      AUTH_ADMIN_NOME: Administrador CI
      AUTH_ALLOW_PUBLIC_REGISTER: "false"
      CHAT_ALLOW_MOCK: "true"
      SWAGGER_ENABLED: "false"
      CORS_ORIGINS: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test -- --passWithNoTests

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: E2E critical flow
        run: npm run test:e2e
