name: Caliber Sync
on:
  schedule:
    - cron: '0 3 * * 1-5'
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: caliber-ai-org/ai-setup@v1
        with:
          mode: sync
          auto-refresh: true
          comment: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
